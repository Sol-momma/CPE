<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPE PDF問題一覧</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #09090e;
  --surface: #111118;
  --surface-hover: #18181f;
  --border: #1f1f2e;
  --border-hover: #2e2e45;
  --text: #ddddf0;
  --text-muted: #55557a;
  --text-sub: #8888aa;

  --basics:     #5b9cf6;
  --strings:    #b57af5;
  --numbase:    #34d399;
  --primes:     #fbbf24;
  --geometry:   #38bdf8;
  --sorting:    #f87171;
  --simulation: #f472b6;
}

html { font-size: 14px; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  background-image:
    linear-gradient(rgba(31,31,46,0.4) 1px, transparent 1px),
    linear-gradient(90deg, rgba(31,31,46,0.4) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* ── Header ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(9, 9, 14, 0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px 0;
}

.header-inner {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 12px;
}

.logo {
  font-family: 'Courier New', Courier, monospace;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text);
}

.logo-accent {
  background: linear-gradient(90deg, #5b9cf6, #b57af5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-sub {
  font-size: 0.72rem;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.progress-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Courier New', monospace;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.progress-meta strong {
  font-size: 1.1rem;
  color: var(--text);
}

.progress-pct {
  font-size: 0.7rem;
  color: var(--text-muted);
}

/* Progress bar */
.progress-bar-wrap {
  height: 3px;
  background: var(--border);
  margin: 0 -28px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #5b9cf6 0%, #b57af5 35%, #34d399 65%, #fbbf24 100%);
  background-size: 200% 100%;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

/* ── Filters ── */
.filters {
  display: flex;
  gap: 6px;
  padding: 10px 28px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
  background: rgba(9,9,14,0.8);
}
.filters::-webkit-scrollbar { display: none; }

.filter-btn {
  flex-shrink: 0;
  padding: 4px 14px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 0.75rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
}

.filter-btn:hover {
  color: var(--text);
  border-color: var(--border-hover);
  background: var(--surface-hover);
}

.filter-btn.active { font-weight: 600; }
.filter-btn[data-cat="all"].active    { color: var(--text); border-color: #444; background: var(--surface); }
.filter-btn[data-cat="basics"].active    { color: var(--basics);     border-color: var(--basics);     background: rgba(91,156,246,.08); }
.filter-btn[data-cat="strings"].active   { color: var(--strings);    border-color: var(--strings);    background: rgba(181,122,245,.08); }
.filter-btn[data-cat="numbase"].active   { color: var(--numbase);    border-color: var(--numbase);    background: rgba(52,211,153,.08); }
.filter-btn[data-cat="primes"].active    { color: var(--primes);     border-color: var(--primes);     background: rgba(251,191,36,.08); }
.filter-btn[data-cat="geometry"].active  { color: var(--geometry);   border-color: var(--geometry);   background: rgba(56,189,248,.08); }
.filter-btn[data-cat="sorting"].active   { color: var(--sorting);    border-color: var(--sorting);    background: rgba(248,113,113,.08); }
.filter-btn[data-cat="simulation"].active{ color: var(--simulation); border-color: var(--simulation); background: rgba(244,114,182,.08); }

/* ── Main ── */
main {
  padding: 24px 28px 60px;
  max-width: 1440px;
  margin: 0 auto;
}

/* ── Category section ── */
.cat-section { margin-bottom: 36px; }

.cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.cat-pip {
  width: 6px; height: 20px;
  border-radius: 3px;
  flex-shrink: 0;
}

.cat-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-sub);
}

.cat-progress-text {
  font-family: 'Courier New', monospace;
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-left: auto;
}

.cat-mini-bar {
  width: 60px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.cat-mini-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ── Cards grid ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 8px;
}

/* ── Problem card ── */
.problem-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px 12px;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.2s ease;
  overflow: hidden;
  animation: cardIn 0.3s ease both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.problem-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 10px 0 0 10px;
  transition: opacity 0.2s;
}

.problem-card[data-cat="basics"]::before     { background: var(--basics); }
.problem-card[data-cat="strings"]::before    { background: var(--strings); }
.problem-card[data-cat="numbase"]::before    { background: var(--numbase); }
.problem-card[data-cat="primes"]::before     { background: var(--primes); }
.problem-card[data-cat="geometry"]::before   { background: var(--geometry); }
.problem-card[data-cat="sorting"]::before    { background: var(--sorting); }
.problem-card[data-cat="simulation"]::before { background: var(--simulation); }

.problem-card:hover {
  background: var(--surface-hover);
  border-color: var(--border-hover);
  transform: translateY(-2px);
}

.problem-card[data-cat="basics"]:hover     { box-shadow: 0 4px 20px rgba(91,156,246,.12); }
.problem-card[data-cat="strings"]:hover    { box-shadow: 0 4px 20px rgba(181,122,245,.12); }
.problem-card[data-cat="numbase"]:hover    { box-shadow: 0 4px 20px rgba(52,211,153,.12); }
.problem-card[data-cat="primes"]:hover     { box-shadow: 0 4px 20px rgba(251,191,36,.12); }
.problem-card[data-cat="geometry"]:hover   { box-shadow: 0 4px 20px rgba(56,189,248,.12); }
.problem-card[data-cat="sorting"]:hover    { box-shadow: 0 4px 20px rgba(248,113,113,.12); }
.problem-card[data-cat="simulation"]:hover { box-shadow: 0 4px 20px rgba(244,114,182,.12); }

/* Done state */
.problem-card.done {
  opacity: 0.38;
}
.problem-card.done:hover { opacity: 0.55; }

.done-badge {
  position: absolute;
  top: 10px; right: 12px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--numbase);
  letter-spacing: 0.06em;
  opacity: 0;
  transition: opacity 0.15s;
}
.problem-card.done .done-badge { opacity: 1; }

/* Card content */
.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.cpe-num {
  font-family: 'Courier New', monospace;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

.uva-num {
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: var(--text-muted);
  margin-left: auto;
  margin-right: 20px;
}

.card-title {
  font-size: 0.855rem;
  font-weight: 500;
  line-height: 1.35;
  color: var(--text);
  margin-bottom: 12px;
  padding-right: 8px;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.pdf-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.68rem;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  text-decoration: none;
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  transition: all 0.15s;
}

.pdf-link:hover {
  color: var(--text);
  border-color: var(--border-hover);
  background: var(--surface-hover);
}

/* Checkbox */
.check-box {
  width: 18px; height: 18px;
  border: 1.5px solid var(--border-hover);
  border-radius: 5px;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  background: transparent;
  position: relative;
}

.check-box:hover {
  border-color: var(--numbase);
}

.check-box:checked {
  background: var(--numbase);
  border-color: var(--numbase);
}

.check-box:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1.5px;
  width: 5px; height: 9px;
  border: 2px solid #09090e;
  border-top: none;
  border-left: none;
  transform: rotate(45deg);
}

/* Empty state */
.empty-msg {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8rem;
  padding: 48px 0;
}

/* ── PDF-first monochrome refresh ──
   The page is intentionally reduced to one primary action: opening a problem PDF.
   Existing category colors and completion controls are overridden so they cannot
   compete with the document list or its large action buttons. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-hover: #f4f4f4;
  --border: #d9d9d9;
  --border-hover: #0a0a0a;
  --text: #0a0a0a;
  --text-muted: #777777;
  --text-sub: #3d3d3d;
}

html {
  background: #ffffff;
}

body {
  background: #ffffff;
  background-image: none;
  color: #0a0a0a;
  font-family: Arial, "Helvetica Neue", "Noto Sans JP", sans-serif;
}

header {
  min-height: 66px;
  padding: 0 40px;
  background: rgba(255, 255, 255, 0.94);
  border-bottom: 1px solid #0a0a0a;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.header-inner {
  min-height: 65px;
  margin: 0;
  align-items: center;
  gap: 18px;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  color: #0a0a0a;
  font-family: Arial, "Helvetica Neue", sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  text-decoration: none;
}

.logo-accent {
  padding-left: 14px;
  border-left: 1px solid #0a0a0a;
  background: none;
  color: #0a0a0a;
  -webkit-text-fill-color: currentColor;
}

.header-sub {
  margin-left: auto;
  color: #0a0a0a;
  font-family: "Courier New", monospace;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
}

main {
  max-width: none;
  padding: 0 40px 96px;
}

.hero {
  padding: clamp(64px, 6.5vw, 92px) 0 clamp(68px, 7vw, 100px);
  border-bottom: 1px solid #0a0a0a;
  animation: heroIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.hero-kicker {
  margin-bottom: 22px;
  font-family: "Courier New", monospace;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.hero h1 {
  max-width: 1200px;
  font-size: clamp(4rem, 7vw, 7rem);
  font-weight: 700;
  line-height: 0.88;
  letter-spacing: -0.075em;
}

.hero h1 span {
  white-space: nowrap;
}

.hero-copy {
  max-width: 520px;
  margin-top: 30px;
  color: #555555;
  font-size: 1rem;
  line-height: 1.8;
}

@keyframes heroIn {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: translateY(0); }
}

.filters {
  position: sticky;
  top: 66px;
  z-index: 80;
  gap: 0;
  margin: 0;
  padding: 0;
  overflow-x: auto;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid #0a0a0a;
}

.filter-btn {
  min-height: 58px;
  padding: 0 22px;
  border: 0;
  border-right: 1px solid #d9d9d9;
  border-radius: 0;
  background: transparent;
  color: #777777;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.filter-btn:hover {
  border-color: #d9d9d9;
  background: #f1f1f1;
  color: #0a0a0a;
}

body .filter-btn.active {
  border-color: #0a0a0a !important;
  background: #0a0a0a !important;
  color: #ffffff !important;
}

#problem-list {
  min-height: 50vh;
}

.cat-section {
  margin: 0;
}

.cat-header {
  margin: 0;
  padding: 76px 0 20px;
  border-bottom: 2px solid #0a0a0a;
}

.cat-label {
  color: #0a0a0a;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-transform: none;
}

.cat-progress-text {
  margin-left: auto;
  color: #555555;
  font-family: "Courier New", monospace;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
}

.cards-grid {
  display: block;
}

.problem-card {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr) 176px;
  align-items: center;
  gap: 24px;
  min-height: 112px;
  padding: 20px 0;
  overflow: visible;
  border: 0;
  border-bottom: 1px solid #d9d9d9;
  border-radius: 0;
  background: #ffffff;
  color: #0a0a0a;
  text-decoration: none;
  transition: background 0.18s ease, padding 0.18s ease;
  animation: rowIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.problem-card::before {
  display: none;
}

.problem-card:hover {
  padding-right: 10px;
  padding-left: 10px;
  border-color: #0a0a0a;
  background: #f3f3f3;
  box-shadow: none !important;
  transform: none;
}

.problem-card:focus-visible {
  outline: 3px solid #0a0a0a;
  outline-offset: 3px;
}

@keyframes rowIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.cpe-num {
  color: #555555;
  font-family: "Courier New", monospace;
  font-size: 0.76rem;
  letter-spacing: 0.05em;
}

.problem-info {
  display: flex;
  align-items: baseline;
  gap: 18px;
  min-width: 0;
}

.card-title {
  margin: 0;
  padding: 0;
  color: #0a0a0a;
  font-size: clamp(1.1rem, 2vw, 1.55rem);
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.025em;
}

.uva-num {
  flex-shrink: 0;
  margin: 0;
  color: #777777;
  font-family: "Courier New", monospace;
  font-size: 0.7rem;
}

.pdf-link {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  width: 176px;
  min-height: 58px;
  padding: 0 20px;
  border: 1px solid #0a0a0a;
  border-radius: 0;
  background: #0a0a0a;
  color: #ffffff;
  font-family: Arial, "Helvetica Neue", sans-serif;
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  transition: background 0.18s ease, color 0.18s ease;
}

.pdf-link span {
  font-size: 1.35rem;
  font-weight: 400;
  transition: transform 0.18s ease;
}

.problem-card:hover .pdf-link {
  background: #ffffff;
  color: #0a0a0a;
}

.problem-card:hover .pdf-link span {
  transform: translate(3px, -3px);
}

@media (max-width: 720px) {
  header {
    min-height: 60px;
    padding: 0 20px;
  }

  .header-inner {
    min-height: 59px;
  }

  .logo {
    gap: 10px;
    font-size: 0.72rem;
  }

  .logo-accent {
    padding-left: 10px;
  }

  .header-sub {
    font-size: 0.62rem;
  }

  main {
    padding: 0 20px 72px;
  }

  .hero {
    padding: 72px 0 80px;
  }

  .hero-kicker {
    margin-bottom: 24px;
  }

  .hero h1 {
    font-size: clamp(3rem, 13vw, 4rem);
    line-height: 0.92;
  }

  .hero-copy {
    margin-top: 32px;
    font-size: 0.9rem;
  }

  .filters {
    top: 60px;
    margin: 0 -20px;
    padding-left: 20px;
  }

  .filter-btn {
    min-height: 54px;
    padding: 0 18px;
  }

  .cat-header {
    padding-top: 60px;
  }

  .problem-card {
    grid-template-columns: 56px minmax(0, 1fr);
    gap: 14px;
    min-height: 0;
    padding: 22px 0;
  }

  .problem-card:hover {
    padding-right: 6px;
    padding-left: 6px;
  }

  .problem-info {
    display: block;
  }

  .card-title {
    font-size: 1.15rem;
  }

  .uva-num {
    display: inline-block;
    margin-top: 8px;
  }

  .pdf-link {
    grid-column: 2;
    width: 100%;
    min-height: 56px;
    margin-top: 4px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero,
  .problem-card {
    animation: none;
  }
  .problem-card,
  .pdf-link,
  .pdf-link span {
    transition: none;
  }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">CPE <span class="logo-accent">PDF ARCHIVE</span></a>
    <div class="header-sub">49 PROBLEMS</div>
  </div>
</header>

<main>
  <section class="hero" aria-labelledby="page-title">
    <p class="hero-kicker">CPE 49 / PDF COLLECTION</p>
    <h1 id="page-title"><span>問題を選んで、</span><br><span>PDFを開く。</span></h1>
    <p class="hero-copy">CPE対策49問の問題文を、カテゴリ別にまとめています。</p>
  </section>

  <nav class="filters" aria-label="問題カテゴリ">
    <button class="filter-btn active" data-cat="all" aria-pressed="true">すべて</button>
    <button class="filter-btn" data-cat="basics" aria-pressed="false">基礎</button>
    <button class="filter-btn" data-cat="strings" aria-pressed="false">文字列</button>
    <button class="filter-btn" data-cat="numbase" aria-pressed="false">進数変換</button>
    <button class="filter-btn" data-cat="primes" aria-pressed="false">素数・因数</button>
    <button class="filter-btn" data-cat="geometry" aria-pressed="false">幾何</button>
    <button class="filter-btn" data-cat="sorting" aria-pressed="false">ソート</button>
    <button class="filter-btn" data-cat="simulation" aria-pressed="false">シミュレーション</button>
  </nav>

  <div id="problem-list"></div>
</main>

<script>
const CATS = [
  { id:'basics',     name:'基礎',              color:'#5b9cf6' },
  { id:'strings',    name:'文字と文字列',       color:'#b57af5' },
  { id:'numbase',    name:'進数変換',           color:'#34d399' },
  { id:'primes',     name:'素数・因数・倍数',   color:'#fbbf24' },
  { id:'geometry',   name:'幾何・座標',         color:'#38bdf8' },
  { id:'sorting',    name:'ソート・中央値',     color:'#f87171' },
  { id:'simulation', name:'シミュレーション',   color:'#f472b6' },
];

const PROBLEMS = [
  // 基礎
  {id:'CPE01',name:"Vito's Family",              uva:10041,cat:'basics',    pdf:"49題/00_基礎/CPE01 Vito'sFamily/Vito'sFamily.pdf"},

let activeFilter = 'all';

function render() {
  const list = document.getElementById('problem-list');
  list.innerHTML = '';

  const catsToShow = activeFilter === 'all'
    ? CATS
    : CATS.filter(c => c.id === activeFilter);

  if (catsToShow.length === 0) {
    list.innerHTML = '<p class="empty-msg">問題が見つかりません</p>';
    return;
  }

  catsToShow.forEach(cat => {
    const probs = PROBLEMS.filter(p => p.cat === cat.id);

    const sec = document.createElement('section');
    sec.className = 'cat-section';
    sec.id = 'cat-' + cat.id;
    sec.innerHTML = `
      <div class="cat-header">
        <span class="cat-label">${cat.name}</span>
        <span class="cat-progress-text">${String(probs.length).padStart(2, '0')} PDFs</span>
      </div>
      <div class="cards-grid" id="grid-${cat.id}"></div>
    `;
    list.appendChild(sec);

    const grid = sec.querySelector('.cards-grid');
    probs.forEach((p, i) => {
      const card = document.createElement('a');
      card.className = 'problem-card';
      card.dataset.cat = p.cat;
      card.href = encodeURI(p.pdf);
      card.target = '_blank';
      card.rel = 'noopener';
      card.setAttribute('aria-label', `${p.name}のPDFを開く`);
      card.style.animationDelay = (i * 0.03) + 's';

      card.innerHTML = `
        <span class="cpe-num">${p.id}</span>
        <div class="problem-info">
          <h2 class="card-title">${p.name}</h2>
          <span class="uva-num">UVa ${p.uva}</span>
        </div>
        <span class="pdf-link">PDFを開く <span aria-hidden="true">↗</span></span>
      `;
      grid.appendChild(card);
    });
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.cat;
    document.querySelectorAll('.filter-btn').forEach(b => {
      const isActive = b === btn;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-pressed', String(isActive));
    });
    btn.classList.add('active');
    render();
  });
});

render();
</script>
